---
# cPanel Git Version Control runs these when you click "Deploy HEAD Commit".
# Only the main branch deploys, to the live site https://mu.isma.org.my.
# Any other branch stops here without copying anything.
# Staging is local: changes are reviewed on http://localhost:5082 before they reach main.
deployment:
  tasks:
    - export BRANCH=$(git rev-parse --abbrev-ref HEAD)
    - if [ "$BRANCH" = "main" ]; then export DEPLOYPATH=/home/ismaweb/public_html/mu.isma.org.my/; else export DEPLOYPATH=; fi
    - /bin/cp index.html engine.js icons.js "${DEPLOYPATH:?only the main branch deploys}"
    - /bin/cp -R templates "${DEPLOYPATH:?only the main branch deploys}"
    - /bin/cp -R assets "${DEPLOYPATH:?only the main branch deploys}"
